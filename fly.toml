# fly.toml app configuration file generated for project-yomu on 2026-08-23T12:00:01Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'project-yomu'
primary_region = 'nrt'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512

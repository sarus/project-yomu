app = "yomu-test"
primary_region = "iad"

[build]

[env]
  PORT = "3000"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

# Secrets (DATABASE_URL, JWT_SECRET, GOOGLE_CLIENT_ID/SECRET, AZURE_SPEECH_KEY, etc.)
# are NOT set here — set them with:
#   fly secrets set DATABASE_URL=... JWT_SECRET=... GOOGLE_CLIENT_ID=... \
#     GOOGLE_CLIENT_SECRET=... AZURE_SPEECH_KEY=... AZURE_SPEECH_REGION=...
